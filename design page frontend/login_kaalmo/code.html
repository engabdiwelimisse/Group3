<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<style>
        body {
            background-color: #F8FAF9; /* Level 0 Background */
        }

<body class="min-h-screen flex flex-col font-body-md text-on-surface antialiased">
<!-- Top Navigation (Simplified for Transactional) -->
<header class="bg-surface border-b border-outline-variant w-full h-16 flex items-center px-gutter">
<div class="w-full max-w-container-max mx-auto flex justify-between items-center">
<a class="font-headline-md text-headline-md font-bold text-primary" href="#">Kaalmo</a>
<button class="font-label-md text-label-md text-primary flex items-center gap-xs hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined" data-icon="language" style="font-size: 20px;">language</span>
                Somali | English
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-md sm:p-lg md:p-xxl">
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-xl p-lg sm:p-xl shadow-sm relative overflow-hidden">
<!-- Subtle decorative background element for trust/brand -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Securely log in to continue.</p>
</div>
<form class="space-y-lg">
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="identifier">Email or Phone Number</label>
<input class="w-full h-[48px] px-md rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-2 focus:border-primary focus:ring-0 font-body-md text-body-md transition-all placeholder:text-outline-variant" id="identifier" name="identifier" placeholder="Enter your email or phone" required="" type="text"/>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-[48px] pl-md pr-[48px] rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-2 focus:border-primary focus:ring-0 font-body-md text-body-md transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute right-0 top-0 h-full px-md flex items-center justify-center text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<button class="w-full h-[48px] bg-primary-container text-on-primary rounded-lg font-label-md text-label-md hover:opacity-90 transition-opacity flex items-center justify-center gap-sm" type="submit">
                    Log In
                    <span class="material-symbols-outlined" data-icon="login" style="font-size: 20px;">login</span>
</button>
</form>
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="font-label-md text-label-md text-primary hover:underline" href="#">Sign up</a>
</p>
</div>
<!-- Trust Indicators -->
<div class="mt-xl pt-lg border-t border-outline-variant flex justify-center gap-md">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>
<span class="font-body-sm text-body-sm text-[12px]">Secure connection</span>
</div>
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="verified">verified</span>
<span class="font-body-sm text-body-sm text-[12px]">Trusted platform</span>
</div>
</div>
</div>
</main>
<!-- Footer (Simplified for Transactional) -->
<footer class="w-full border-t border-outline-variant bg-surface-container-lowest py-lg mt-auto">
<div class="max-w-container-max mx-auto px-gutter text-center font-body-sm text-body-sm text-on-surface-variant flex flex-col md:flex-row justify-between items-center gap-md">
<span>© 2024 Kaalmo Somalia. Human-centered Trust.</span>
<div class="flex gap-lg">
<a class="hover:text-primary transition-colors" href="#">Help Center</a>
<a class="hover:text-primary transition-colors" href="#">Privacy</a>
<a class="hover:text-primary transition-colors" href="#">Terms</a>
</div>
</div>
</footer>
</body></html>

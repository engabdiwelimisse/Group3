<!DOCTYPE html>

<style>
        body {
            background-color: #F8FAF9; /* Level 0 Background */
        }
        .form-input {
            border: 1px solid #DCE4E3;
            border-radius: 8px;
            padding: 12px 16px;
            width: 100%;
            transition: border-color 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border: 2px solid #0B7189;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #131d1d;
        }
    </style>
</head>
<body class="font-body-md text-body-md text-on-background min-h-screen flex flex-col">
<!-- Header (Suppressed main nav, simplified for focused flow) -->
<header class="bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-16 shrink-0">
<div class="font-headline-md text-headline-md font-bold text-primary">Kaalmo</div>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs font-label-md text-label-md">
<span class="material-symbols-outlined text-[20px]">close</span>
            Exit Setup
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-md md:px-gutter py-xl md:py-xxl">
<!-- Progress Stepper -->
<div class="mb-xl md:mb-xxl w-full max-w-3xl mx-auto">
<div class="flex items-center justify-between mb-sm relative">
<div class="absolute top-1/2 left-0 w-full h-1 bg-surface-variant -z-10 -translate-y-1/2 rounded-full"></div>
<div class="absolute top-1/2 left-0 w-[16.66%] h-1 bg-primary-container -z-10 -translate-y-1/2 rounded-full transition-all duration-300"></div>
<!-- Step 1: Active -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center font-label-md text-label-md font-bold shadow-sm">1</div>
<span class="font-label-md text-label-md text-primary font-semibold hidden md:block">Basics</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-xs opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-md text-label-md font-bold">2</div>
<span class="font-label-md text-label-md text-on-surface-variant hidden md:block">Story</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-xs opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-md text-label-md font-bold">3</div>
<span class="font-label-md text-label-md text-on-surface-variant hidden md:block">Media</span>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center gap-xs opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-md text-label-md font-bold">4</div>
<span class="font-label-md text-label-md text-on-surface-variant hidden md:block">Beneficiary</span>
</div>
<!-- Step 5 -->
<div class="flex flex-col items-center gap-xs opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-md text-label-md font-bold">5</div>
<span class="font-label-md text-label-md text-on-surface-variant hidden md:block">Verification</span>
</div>
<!-- Step 6 -->
<div class="flex flex-col items-center gap-xs opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-md text-label-md font-bold">6</div>
<span class="font-label-md text-label-md text-on-surface-variant hidden md:block">Review</span>
</div>
</div>
</div>
<!-- Form Container (Level 1 Surface) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg md:p-xl w-full max-w-2xl mx-auto shadow-sm">
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs hidden md:block">Campaign Basics</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs md:hidden">Campaign Basics</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Let's start with the fundamental details of your fundraiser.</p>
</div>
<form class="space-y-lg flex flex-col">
<!-- Campaign Title -->
<div>
<label class="form-label font-label-md text-label-md" for="campaign-title">Campaign Title</label>
<input class="form-input bg-surface-container-lowest text-on-surface font-body-md text-body-md" id="campaign-title" placeholder="e.g., Support for Drought Relief in Gedo" type="text"/>
<p class="font-body-sm text-body-sm text-outline mt-xs">Keep it clear and descriptive.</p>
</div>
<!-- Category & Goal Row (Bento-ish layout on desktop) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Category Selection -->
<div>
<label class="form-label font-label-md text-label-md" for="category">Category</label>
<div class="relative">
<select class="form-input bg-surface-container-lowest text-on-surface font-body-md text-body-md appearance-none pr-10" id="category">
<option disabled="" selected="" value="">Select a category</option>
<option value="emergency">Emergency Relief</option>
<option value="medical">Medical Assistance</option>
<option value="education">Education</option>
<option value="community">Community Project</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Goal Amount -->
<div>
<label class="form-label font-label-md text-label-md" for="goal-amount">Goal Amount ($ USD)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-numeric-data text-numeric-data">$</span>
<input class="form-input bg-surface-container-lowest text-on-surface font-numeric-data text-numeric-data pl-8" id="goal-amount" min="0" placeholder="0.00" step="100" type="number"/>
</div>
</div>
</div>
<!-- Region & Date Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Region Selection -->
<div>
<label class="form-label font-label-md text-label-md" for="region">Region</label>
<div class="relative">
<select class="form-input bg-surface-container-lowest text-on-surface font-body-md text-body-md appearance-none pr-10" id="region">
<option disabled="" selected="" value="">Select region</option>
<option value="banaadir">Banaadir</option>
<option value="gedo">Gedo</option>
<option value="mudug">Mudug</option>
<option value="nugaal">Nugaal</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Target End Date -->
<div>
<label class="form-label font-label-md text-label-md" for="end-date">Target End Date</label>
<div class="relative">
<input class="form-input bg-surface-container-lowest text-on-surface font-body-md text-body-md" id="end-date" type="date"/>
</div>
</div>
</div>
</form>
</div>
</main>
<!-- Footer Actions (Sticky on mobile, static on desktop) -->
<div class="bg-surface-container-lowest border-t border-outline-variant p-md md:p-lg sticky bottom-0 z-10 w-full mt-auto">
<div class="max-w-container-max mx-auto flex flex-col-reverse md:flex-row justify-between items-center gap-md">
<button class="w-full md:w-auto px-lg py-sm rounded-lg border border-outline-variant text-primary font-label-md text-label-md hover:bg-surface-container-low transition-colors text-center">
                Save Draft
            </button>
<button class="w-full md:w-auto px-lg py-sm rounded-lg bg-primary-container text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity flex items-center justify-center gap-xs">
                Next: Campaign Story
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
